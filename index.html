<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hamid SMM Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d1b;color:white;font-family:Arial}
header{background:#111a30;padding:20px;text-align:center}
header h2{color:#00e5ff}
.hero{text-align:center;padding:35px 15px;background:linear-gradient(135deg,#10264c,#30105a)}
button{background:#00d9ff;border:0;padding:12px 20px;border-radius:7px;font-weight:bold;cursor:pointer}
input{width:100%;padding:13px;margin:9px 0;border-radius:7px;border:0}
.panel{background:#17223b;padding:20px;border-radius:12px;margin:20px auto;max-width:400px}
.hidden{display:none}
.services{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.card{background:#17223b;padding:18px;text-align:center;border-radius:10px}
.price{color:#00ff9d}
</style>
</head>
<body>

<header>
<h2>🔥 HAMID SMM PANEL</h2>
<p>Welcome to our SMM Panel</p>
</header>

<div class="hero">
<h1>Grow Your Social Media</h1>
<p>Choose your favourite services</p>
<button onclick="show('login')">Login</button>
<button onclick="show('register')">Register</button>
</div>

<div id="login" class="panel">
<h2>Customer Login</h2>
<input id="loginEmail" type="email" placeholder="Email">
<input id="loginPass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="loginMsg"></p>
</div>

<div id="register" class="panel hidden">
<h2>Create Account</h2>
<input id="name" placeholder="Full Name">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Create Password">
<button onclick="register()">Register</button>
<p id="registerMsg"></p>
</div>

<div id="dashboard" class="panel hidden">
<h2>Customer Dashboard</h2>
<p id="welcome"></p>
<button onclick="logout()">Logout</button>
</div>

<h2 style="text-align:center">Our Services</h2>
<div class="services">
<div class="card"><h3>Instagram Followers</h3><p class="price">₹150 / 1K</p></div>
<div class="card"><h3>Instagram Likes</h3><p class="price">₹50 / 1K</p></div>
<div class="card"><h3>Instagram Views</h3><p class="price">₹5 / 1K</p></div>
<div class="card"><h3>Instagram Shares</h3><p class="price">Contact Admin</p></div>
</div>

<script>
function show(id){
['login','register','dashboard'].forEach(x=>{
document.getElementById(x).classList.add('hidden');
});
document.getElementById(id).classList.remove('hidden');
}

function register(){
let n=document.getElementById('name').value;
let e=document.getElementById('email').value;
let p=document.getElementById('password').value;
if(!n||!e||!p){alert('Please fill all details');return;}
document.getElementById('registerMsg').innerText='Demo registration only. Secure account system is not connected yet.';
}

function login(){
document.getElementById('loginMsg').innerText='Demo login only. Secure account system is not connected yet.';
}

function logout(){
show('login');
}
</script>

</body>
</html>
