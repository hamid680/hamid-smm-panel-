<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMID SMM PANEL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial;padding:15px}
.container{max-width:850px;margin:auto}
h1{text-align:center;color:#38bdf8}
.card{background:#172036;padding:18px;border-radius:12px;margin:15px 0}
input,select,button{width:100%;padding:12px;margin:7px 0;border:0;border-radius:7px}
input,select{background:#26334d;color:white}
button{background:#0ea5e9;color:white;font-weight:bold;cursor:pointer}
button:hover{background:#0284c7}
.small{font-size:13px;color:#cbd5e1}
.item{background:#26334d;padding:12px;border-radius:8px;margin:8px 0}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<h1>HAMID SMM PANEL</h1>
<p style="text-align:center">Grow Your Social Media 🚀</p>

<div class="card" id="authBox">
<h3>Login / Signup</h3>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Signup</button>
<button onclick="login()">Login</button>
<p id="authMsg" class="small"></p>
</div>

<div class="card hidden" id="userBox">
<p id="welcome"></p>
<button onclick="logout()">Logout</button>
</div>

<div class="card">
<h3>Our Services</h3>
<div id="services">Loading services...</div>
</div>

<div class="card hidden" id="orderBox">
<h3>Place Order</h3>
<select id="service"></select>
<input id="quantity" type="number" placeholder="Quantity">
<input id="target" type="url" placeholder="Instagram / Social Media Link">
<p id="priceText">Price: ₹0</p>
<button onclick="placeOrder()">Place Order</button>
<p id="orderMsg" class="small"></p>
</div>

<div class="card hidden" id="myOrders">
<h3>My Orders</h3>
<div id="ordersList"></div>
</div>

<div class="card hidden" id="adminBox">
<h2>Admin Dashboard</h2>
<h3>Manage Orders</h3>
<button onclick="loadAdminOrders()">Refresh Orders</button>
<div id="adminOrders"></div>
<hr>
<h3>Add Service</h3>
<input id="newName" placeholder="Service name">
<input id="newDescription" placeholder="Description">
<input id="newPrice" type="number" placeholder="Price per 1000">
<button onclick="addService()">Add Service</button>
<p id="adminMsg" class="small"></p>
</div>
</div>

<script>
const SUPABASE_URL = "https://matxhmjpncwwcpzmcjgr.supabase.co";
const SUPABASE_KEY = "sb_publishable_vkWlnEro7wE_e8n-Xlt_Q_dRwlkLzg";
const ADMIN_EMAIL = "hamidislamlove67@gmail.com";

const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser = null;
let services = [];

async function signup(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const {error}=await db.auth.signUp({email,password});
 document.getElementById("authMsg").innerText=error?error.message:"Signup successful! Ab login karo.";
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const {error}=await db.auth.signInWithPassword({email,password});
 document.getElementById("authMsg").innerText=error?error.message:"Login successful!";
 if(!error) await checkUser();
}

async function logout(){
 await db.auth.signOut();
 currentUser=null;
 showUser();
}

async function checkUser(){
 const {data}=await db.auth.getUser();
 currentUser=data.user;
 showUser();
 await loadServices();
 if(currentUser){
  await loadMyOrders();
  if(currentUser.email===ADMIN_EMAIL) await loadAdminOrders();
 }
}

function showUser(){
 const logged=!!currentUser;
 document.getElementById("authBox").classList.toggle("hidden",logged);
 document.getElementById("userBox").classList.toggle("hidden",!logged);
 document.getElementById("orderBox").classList.toggle("hidden",!logged);
 document.getElementById("myOrders").classList.toggle("hidden",!logged);
 document.getElementById("adminBox").classList.toggle("hidden",!logged || currentUser.email!==ADMIN_EMAIL);
 document.getElementById("welcome").innerText=logged?"Welcome "+currentUser.email:"";
}

async function loadServices(){
 const box=document.getElementById("services");
 box.innerHTML="Loading services...";
 const {data,error}=await db.from("services").select("*").eq("is_active",true).order("id");
 if(error){box.innerText=error.message;return}
 services=data||[];
 const select=document.getElementById("service");
 select.innerHTML="";
 box.innerHTML="";
 services.forEach(s=>{
  box.innerHTML+=`<div class="item"><b>${safe(s.name)}</b><br>${safe(s.description||"")}<br>₹${s.price} / 1000</div>`;
  select.innerHTML+=`<option value="${s.id}">${safe(s.name)} - ₹${s.price}/1000</option>`;
 });
 if(!services.length) box.innerText="No active services available.";
 updatePrice();
}

function safe(value){
 return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function updatePrice(){
 const s=services.find(x=>String(x.id)===document.getElementById("service").value);
 const q=Number(document.getElementById("quantity").value)||0;
 document.getElementById("priceText").innerText="Price: ₹"+(s?(Number(s.price)*q/1000).toFixed(2):"0");
}
document.getElementById("service").addEventListener("change",updatePrice);
document.getElementById("quantity").addEventListener("input",updatePrice);

async function placeOrder(){
 if(!currentUser)return;
 const service_id=Number(document.getElementById("service").value);
 const quantity=Number(document.getElementById("quantity").value);
 const target_link=document.getElementById("target").value.trim();
 const s=services.find(x=>Number(x.id)===service_id);
 if(!s||quantity<1||!target_link){document.getElementById("orderMsg").innerText="Please fill all details.";return}
 const total_price=Number((Number(s.price)*quantity/1000).toFixed(2));
 const {error}=await db.from("orders").insert({
  user_id:currentUser.id,
  customer_name:currentUser.email,
  service_id,
  quantity,
  target_link,
  total_price,
  status:"Pending"
 });
 document.getElementById("orderMsg").innerText=error?error.message:"Order placed successfully!";
 if(!error){await loadMyOrders();if(currentUser.email===ADMIN_EMAIL)await loadAdminOrders();}
}

async function loadMyOrders(){
 const {data,error}=await db.from("orders").select("*").eq("user_id",currentUser.id).order("created_at",{ascending:false});
 const box=document.getElementById("ordersList");
 if(error){box.innerText=error.message;return}
 box.innerHTML=(data||[]).map(o=>`<div class="item">Order #${o.id}<br>Quantity: ${o.quantity}<br>Status: ${safe(o.status)}<br>Total: ₹${o.total_price}</div>`).join("")||"No orders yet.";
}

async function loadAdminOrders(){
 if(!currentUser||currentUser.email!==ADMIN_EMAIL)return;
 const {data,error}=await db.from("orders").select("*").order("created_at",{ascending:false});
 const box=document.getElementById("adminOrders");
 if(error){box.innerText=error.message;return}
 box.innerHTML="";
 (data||[]).forEach(o=>{
  box.innerHTML+=`<div class="item">
  Order #${o.id}<br>Customer: ${safe(o.customer_name)}<br>
  Service ID: ${o.service_id}<br>Quantity: ${o.quantity}<br>
  Status: ${safe(o.status)}
  <select id="status${o.id}">
  ${["Pending","Processing","Completed","Cancelled"].map(st=>`<option ${o.status===st?"selected":""}>${st}</option>`).join("")}
  </select>
  <button onclick="updateStatus(${o.id})">Update Status</button>
  </div>`;
 });
}

async function updateStatus(id){
 const status=document.getElementById("status"+id).value;
 const {error}=await db.from("orders").update({status}).eq("id",id);
 document.getElementById("adminMsg").innerText=error?error.message:"Order status updated.";
 await loadAdminOrders();
}

async function addService(){
 const name=document.getElementById("newName").value.trim();
 const description=document.getElementById("newDescription").value.trim();
 const price=Number(document.getElementById("newPrice").value);
 if(!name||!price||price<0){document.getElementById("adminMsg").innerText="Enter service name and price.";return}
 const {error}=await db.from("services").insert({name,description,price,is_active:true});
 document.getElementById("adminMsg").innerText=error?error.message:"Service added.";
 if(!error){await loadServices();}
}

db.auth.onAuthStateChange(()=>setTimeout(checkUser,0));
checkUser();
</script>
</body>
</html>
