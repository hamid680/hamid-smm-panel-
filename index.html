<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamid SMM Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#0b1020;color:white;font-family:Arial;padding:20px}
.container{max-width:500px;margin:auto}
h1{text-align:center;color:#38bdf8}
.card{background:#171f3b;padding:18px;border-radius:12px;margin:15px 0}
input,button{width:100%;padding:13px;margin:7px 0;border:0;border-radius:7px;box-sizing:border-box}
button{background:#0ea5e9;color:white;font-weight:bold}
.service{background:#263451;padding:12px;margin:8px 0;border-radius:8px}
#app{display:none}
</style>
</head>
<body>
<div class="container">
<h1>HAMID SMM PANEL</h1>
<p style="text-align:center">Grow Your Social Media 🚀</p>

<div class="card" id="auth">
<h3>Login / Signup</h3>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Signup</button>
<button onclick="login()">Login</button>
<p id="msg"></p>
</div>

<div id="app">
<div class="card">
<h3>Welcome!</h3>
<p id="user"></p>
<button onclick="logout()">Logout</button>
</div>

<div class="card">
<h3>Our Services</h3>
<div id="services">Loading...</div>
</div>

<div class="card">
<h3>Place Order</h3>
<select id="service"></select>
<input id="quantity" type="number" placeholder="Quantity">
<button onclick="order()">Place Order</button>
<p id="orderMsg"></p>
</div>
</div>
</div>

<script>
const SUPABASE_URL = "https://matxhmjpncwwcpzmcjgr.supabase.co";
const SUPABASE_KEY = "sb_publishable_vkWlnEroI7wE_e8n-Xlt_Q_dRwlkLzg";
const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function signup(){
 const email=document.getElementById("email").value;
 const password=document.getElementById("password").value;
 const {error}=await db.auth.signUp({email,password});
 document.getElementById("msg").innerText=error?error.message:"Signup successful! Email confirm karo.";
}
async function login(){
 const email=document.getElementById("email").value;
 const password=document.getElementById("password").value;
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){document.getElementById("msg").innerText=error.message;return;}
 showApp(data.user);
}
async function logout(){
 await db.auth.signOut();
 location.reload();
}
async function showApp(user){
 document.getElementById("auth").style.display="none";
 document.getElementById("app").style.display="block";
 document.getElementById("user").innerText=user.email;
 loadServices();
}
async function loadServices(){
 const box=document.getElementById("services");
 const select=document.getElementById("service");
 const {data,error}=await db.from("services").select("*");
 if(error){box.innerText="Error: "+error.message;return;}
 box.innerHTML="";
 select.innerHTML="";
 if(!data.length){box.innerText="No services available yet.";return;}
 data.forEach(s=>{
  box.innerHTML+=`<div class="service">${s.name}<br>${s.description||""}</div>`;
  select.innerHTML+=`<option value="${s.id}">${s.name}</option>`;
 });
}
async function order(){
 const {data:{user}}=await db.auth.getUser();
 if(!user)return;
 const service_id=Number(document.getElementById("service").value);
 const quantity=Number(document.getElementById("quantity").value);
 if(!service_id||!quantity||quantity<1){document.getElementById("orderMsg").innerText="Valid service aur quantity daalo.";return;}
 const {error}=await db.from("orders").insert({
  user_id:user.id,service_id,quantity,status:"Pending"
 });
 document.getElementById("orderMsg").innerText=error?"Error: "+error.message:"Order submitted! Status: Pending";
}
async function checkSession(){
 const {data}=await db.auth.getSession();
 if(data.session)showApp(data.session.user);
}
checkSession();
</script>
</body>
</html>
