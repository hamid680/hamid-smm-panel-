<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamid SMM Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial}
header{text-align:center;background:#171f3b;padding:22px}
h1{color:#8da8ff}
.container{max-width:600px;margin:auto;padding:15px}
.card{background:#171f3b;padding:18px;border-radius:14px;margin:15px 0}
input,select{width:100%;padding:13px;margin:8px 0;border:0;border-radius:7px}
button{background:#536dfe;color:white;border:0;padding:12px;border-radius:7px;margin:5px;cursor:pointer}
.item{background:#26365f;padding:12px;margin:8px 0;border-radius:8px}
.small{color:#b9c3df;font-size:13px}
</style>
</head>
<body>
<header>
<h1>HAMID SMM PANEL</h1>
<p>Grow Your Social Media 🚀</p>
</header>
<div class="container">

<div class="card" id="auth">
<h2>Login / Signup</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Signup</button>
<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>
<p id="authmsg" class="small"></p>
</div>

<div class="card">
<h2>Our Services</h2>
<div id="services">Loading...</div>
</div>

<div class="card">
<h2>Place Order</h2>
<select id="service"></select>
<input id="link" placeholder="Instagram Post / Profile Link">
<input id="quantity" type="number" min="1" placeholder="Quantity">
<button onclick="placeOrder()">Submit Order</button>
<p id="ordermsg" class="small"></p>
</div>

<div class="card">
<h2>My Orders</h2>
<button onclick="loadOrders()">Refresh Orders</button>
<div id="orders">Login to view orders.</div>
</div>

<div class="card">
<h2>Contact Admin</h2>
<a href="https://wa.me/919821364716">
<button>WhatsApp Admin</button>
</a>
</div>

</div>

<script>
const URL="https://matxhmjpncwwcpzmcjgr.supabase.co";
const KEY="sb_publishable_vkWlnEro7wE_e8n-Xlt_Q_dRwlkLzg";
const db=window.supabase.createClient(URL,KEY);
let services=[];

async function signup(){
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const {error}=await db.auth.signUp({email,password});
document.getElementById("authmsg").textContent=
error?error.message:"Signup successful. Check email if confirmation is required.";
}

async function login(){
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const {error}=await db.auth.signInWithPassword({email,password});
document.getElementById("authmsg").textContent=
error?error.message:"Login successful!";
if(!error)loadOrders();
}

async function logout(){
const {error}=await db.auth.signOut();
document.getElementById("authmsg").textContent=
error?error.message:"Logged out.";
document.getElementById("orders").textContent="Login to view orders.";
}

async function loadServices(){
const box=document.getElementById("services");
const select=document.getElementById("service");
const {data,error}=await db.from("services")
.select("id,name,price").eq("is_active",true);
if(error){box.textContent=error.message;return;}
services=data||[];
box.innerHTML="";
select.innerHTML="";
services.forEach(s=>{
const div=document.createElement("div");
div.className="item";
div.textContent=s.name+" — ₹"+s.price;
box.appendChild(div);
const option=document.createElement("option");
option.value=s.id;
option.textContent=s.name+" — ₹"+s.price;
select.appendChild(option);
});
}

async function placeOrder(){
const {data:{user}}=await db.auth.getUser();
if(!user){alert("Please login first");return;}
const id=Number(document.getElementById("service").value);
const service=services.find(s=>s.id===id);
const link=document.getElementById("link").value.trim();
const quantity=Number(document.getElementById("quantity").value);
if(!service||!link||!Number.isInteger(quantity)||quantity<1){
alert("Enter valid order details");return;
}
const total=Number(service.price)*quantity/1000;
const {error}=await db.from("orders").insert({
user_id:user.id,
service_id:service.id,
quantity:quantity,
target_link:link,
total_price:total,
status:"pending"
});
document.getElementById("ordermsg").textContent=
error?error.message:"Order submitted. Pending admin review.";
if(!error)loadOrders();
}

async function loadOrders(){
const {data:{user}}=await db.auth.getUser();
if(!user){document.getElementById("orders").textContent="Please login first.";return;}
const {data,error}=await db.from("orders")
.select("id,quantity,total_price,status,created_at")
.eq("user_id",user.id).order("created_at",{ascending:false});
const box=document.getElementById("orders");
if(error){box.textContent=error.message;return;}
box.innerHTML="";
(data||[]).forEach(o=>{
const div=document.createElement("div");
div.className="item";
div.textContent="Order #"+o.id+" | Qty: "+o.quantity+
" | ₹"+o.total_price+" | "+o.status;
box.appendChild(div);
});
if(!data||!data.length)box.textContent="No orders yet.";
}

loadServices();
</script>
</body>
</html>
